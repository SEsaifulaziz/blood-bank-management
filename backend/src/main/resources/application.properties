spring.application.name=blood-bank-backend

server.port=8080

# Active profiles directive - includes local overrides automatically
spring.profiles.include=local
#Database connection configuration
# We enforce environment variables for production security.
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

# JPA/Hibernate configuration
# 'update' is fine for development, but we optimize logging for production scale
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=false

# HikariCP Connection Pooling Optimization
# Prevents the application from stalling under heavy concurrent traffic
spring.datasource.hikari.maximum-pool-size=10
spring.datasource.hikari.minimum-idle=5
spring.datasource.hikari.idle-timeout=30000
spring.datasource.hikari.connection-timeout=20000

#Security & cors configuration
app.jwt.secret=${JWT_SECRET}
# 15 minutes in milliseconds (1000 * 60 * 60 * 15)
app.jwt.expiration.ms=900000

# Allows configuration across local environments and deployed React URL
app.cors.allowed-origins=${CORS_ALLOWED_ORIGINS}